name: Delete unused blog category
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string
permissions:
  contents: write
jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Check usage and delete category
        run: node scripts/delete-category.mjs
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
      - name: Commit deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u src/data/categories
          git commit -m "content: delete unused blog category"
          git push origin HEAD:main
